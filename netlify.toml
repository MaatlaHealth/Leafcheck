[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# The officer page is a route inside the single page app.
[[redirects]]
  from = "/officer"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/officer/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/strings.json"
  [headers.values]
    Cache-Control = "no-cache"
